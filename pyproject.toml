[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeops-ai"
version = "0.1.0"
description = "Enterprise knowledge and intelligent operations platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27,<1",
    "langchain-core>=0.3,<2",
    "langchain-groq>=0.3,<1",
    "langchain-mistralai>=0.2,<2",
    "langchain-ollama>=0.3,<1",
    "langchain-qdrant>=0.2,<1",
    "pymongo>=4.13,<5",
    "PyJWT[crypto]>=2.9,<3",
    "defusedxml>=0.7.1,<1",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
